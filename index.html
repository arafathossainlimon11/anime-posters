<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arafat Personal Image Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* Login Screen */
        .login-card { background: var(--card-bg); padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        .login-card h2 { color: var(--accent); margin-bottom: 10px; font-size: 24px; }
        .login-card p { color: var(--text-sub); margin-bottom: 20px; font-size: 14px; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; }
        .input-field:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: #0f172a; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: var(--accent-hover); color: white; }

        /* Main Dashboard */
        .dashboard { display: none; width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .header { background: #0f172a; padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
        .header h1 { color: var(--accent); font-size: 22px; }

        /* Tabs Navigation */
        .nav-tabs { display: flex; background: #0f172a; border-bottom: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 15px; background: transparent; border: none; color: var(--text-sub); font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: var(--card-bg); }

        /* Tab Contents */
        .tab-content { padding: 30px; display: none; }
        .tab-content.active { display: block; }

        /* Drop Area */
        .upload-area { border: 2px dashed #475569; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #0f172a; }
        .upload-area:hover { border-color: var(--accent); background: #1a2638; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; display: block; }

        /* Progress & Result */
        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; color: var(--accent); display: none; }
        .result-box { margin-top: 20px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: none; text-align: center; }
        .preview-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .link-group { display: flex; gap: 10px; }
        .copy-btn { width: 120px; background: var(--success); color: white; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .gallery-item { background: #0f172a; border-radius: 10px; border: 1px solid #334155; overflow: hidden; position: relative; transition: 0.3s; }
        .gallery-item:hover { transform: translateY(-3px); border-color: var(--accent); }
        .gallery-item img { width: 100%; height: 130px; object-fit: cover; cursor: pointer; }
        .gallery-actions { padding: 8px; text-align: center; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-copy { background: var(--accent); color: #0f172a; font-weight: bold; }
        .btn-del { background: var(--danger); color: white; }
        .empty-msg { text-align: center; color: var(--text-sub); padding: 40px 0; }
    </style>
</head>
<body>

    <!-- 1. Lock Screen -->
    <div class="login-card" id="loginCard">
        <h2>🔒 Arafat Image Cloud</h2>
        <p>ওয়েবসাইটে প্রবেশ করতে পাসওয়ার্ড দিন</p>
        <input type="password" id="passInput" class="input-field" placeholder="পাসওয়ার্ড লিখুন...">
        <button class="btn" onclick="checkAuth()">আনলক করুন</button>
    </div>

    <!-- 2. Main Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>🎨 Animation & Movie Image Server</h1>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('uploadTab', this)">📤 নতুন আপলোড</button>
            <button class="tab-btn" onclick="switchTab('galleryTab', this); loadGallery();">🖼️️ আপলোড করা ছবি</button>
        </div>

        <!-- Tab 1: Upload -->
        <div id="uploadTab" class="tab-content active">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <span class="upload-icon">📁</span>
                <p>ছবি সিলেক্ট করতে ক্লিক করুন অথবা টেনে এনে ছেড়ে দিন</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleUpload(this.files[0])">

            <div class="status-msg" id="statusMsg">⏳ ফাইল আপলোড হচ্ছে, অপেক্ষা করুন...</div>

            <div class="result-box" id="resultBox">
                <img id="previewImg" class="preview-img" src="" alt="Preview">
                <div class="link-group">
                    <input type="text" id="directLink" class="input-field" style="margin-bottom:0;" readonly>
                    <button class="btn copy-btn" onclick="copyText('directLink')">কপি লিংক</button>
                </div>
            </div>
        </div>

        <!-- Tab 2: Gallery -->
        <div id="galleryTab" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 16px; color: var(--text-sub);">পূর্বে আপলোড করা ছবিসমূহ</h3>
                <button class="btn-sm btn-del" onclick="clearAllHistory()">সব মুছে ফেলুন</button>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

<script>
    const CORRECT_PASS = "arafat01721313101";
    // Free Public Image API Key
    const API_KEY = "6d207e60d4e927d3701f0e9e64139ee9";

    // Authentication Check
    function checkAuth() {
        const input = document.getElementById('passInput').value;
        if (input === CORRECT_PASS) {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        } else {
            alert('ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
        }
    }

    // Enter key press for login
    document.getElementById('passInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAuth();
    });

    // Switch Tabs
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // Handle Image Upload using Free CORS Image Host
    async function handleUpload(file) {
        if (!file) return;

        const statusMsg = document.getElementById('statusMsg');
        const resultBox = document.getElementById('resultBox');
        
        statusMsg.style.display = 'block';
        resultBox.style.display = 'none';

        const formData = new FormData();
        formData.append('image', file);

        try {
            // Free Public Image Upload Server (No CORS block)
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            statusMsg.style.display = 'none';

            if (result.success && result.data && result.data.url) {
                const fullUrl = result.data.url;
                
                // Show Result
                document.getElementById('previewImg').src = fullUrl;
                document.getElementById('directLink').value = fullUrl;
                resultBox.style.display = 'block';

                // Save to History (localStorage)
                saveToHistory(fullUrl);
            } else {
                alert('আপলোড ব্যর্থ হয়েছে! আবার চেষ্টা করুন।');
            }
        } catch (error) {
            statusMsg.style.display = 'none';
            alert('সার্ভার সংযোগ সমস্যা! আবার চেষ্টা করুন।');
        }
    }

    // Copy Utility
    function copyText(inputId) {
        const input = document.getElementById(inputId);
        input.select();
        navigator.clipboard.writeText(input.value);
        alert('অনলাইন লিংক কপি হয়েছে!');
    }

    function copyDirect(url) {
        navigator.clipboard.writeText(url);
        alert('অনলাইন লিংক কপি হয়েছে!');
    }

    // Local Storage Operations for Gallery
    function saveToHistory(url) {
        let history = JSON.parse(localStorage.getItem('arafat_img_history') || '[]');
        history.unshift({ url: url, time: new Date().toLocaleDateString('bn-BD') });
        localStorage.setItem('arafat_img_history', JSON.stringify(history));
    }

    function loadGallery() {
        const grid = document.getElementById('galleryGrid');
        let history = JSON.parse(localStorage.getItem('arafat_img_history') || '[]');

        if (history.length === 0) {
            grid.innerHTML = '<div class="empty-msg" style="grid-column: 1/-1;">এখনো কোনো ছবি আপলোড করা হয়নি!</div>';
            return;
        }

        grid.innerHTML = history.map((item, index) => `
            <div class="gallery-item">
                <img src="${item.url}" alt="Uploaded Image" onclick="copyDirect('${item.url}')" title="লিংক কপি করতে ক্লিক করুন">
                <div class="gallery-actions">
                    <button class="btn-sm btn-copy" onclick="copyDirect('${item.url}')">কপি</button>
                    <button class="btn-sm btn-del" onclick="deleteHistoryItem(${index})">মুছুন</button>
                </div>
            </div>
        `).join('');
    }

    function deleteHistoryItem(index) {
        let history = JSON.parse(localStorage.getItem('arafat_img_history') || '[]');
        history.splice(index, 1);
        localStorage.setItem('arafat_img_history', JSON.stringify(history));
        loadGallery();
    }

    function clearAllHistory() {
        if (confirm('আপনি কি নিশ্চিত যে সব ছবির ইতিহাস মুছে ফেলতে চান?')) {
            localStorage.removeItem('arafat_img_history');
            loadGallery();
        }
    }
</script>
</body>
</html>
